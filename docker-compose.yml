services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: travel-organizer-frontend:v2
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: travel-organizer-backend:v2
    ports:
      - "4000:4000"
    depends_on:
      - database
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: travel_Organizer
      DB_USER: postgres
      DB_PASSWORD: postgres

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: travel_Organizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: